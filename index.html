<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ScopeMate: freelancer project estimates and client proposals.">
  <title>ScopeMate</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#"><span class="mark">S</span>ScopeMate</a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ky">KG</button>
    <button type="button" data-lang="ru">RU</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1 data-i18n="h1"></h1>
    <p data-i18n="sub"></p>
  </section>

  <div class="grid">
    <div class="col-form">
      <section class="card">
        <h2 data-i18n="details"></h2>
        <form id="form" autocomplete="off">
          <label for="name" data-i18n="name"></label>
          <input id="name" type="text" data-ph="phName">

          <div class="two">
            <div>
              <label for="client" data-i18n="client"></label>
              <input id="client" type="text" data-ph="phClient">
            </div>
            <div>
              <label for="type" data-i18n="type"></label>
              <select id="type">
                <option value="site"></option><option value="shop"></option>
                <option value="portfolio"></option><option value="landing"></option>
                <option value="app"></option><option value="other"></option>
              </select>
            </div>
          </div>

          <div class="two">
            <div>
              <label for="rate" data-i18n="rate"></label>
              <input id="rate" type="number" min="0" step="any" value="800">
            </div>
            <div>
              <label for="currency" data-i18n="currency"></label>
              <select id="currency">
                <option value="KGS">KGS (сом)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
              </select>
            </div>
          </div>

          <div class="two">
            <div>
              <label for="reserve" data-i18n="reserve"></label>
              <input id="reserve" type="number" min="0" max="100" step="1" value="15">
            </div>
            <div>
              <label for="deadline" data-i18n="deadline"></label>
              <input id="deadline" type="date">
            </div>
          </div>
        </form>
      </section>

      <section class="card">
        <h2 data-i18n="tasks"></h2>
        <p class="hint" data-i18n="hint"></p>

        <div class="tpl">
          <span data-i18n="tpl"></span>
          <button type="button" class="btn small" id="applyTpl" data-i18n="tplBtn"></button>
        </div>

        <div class="row head"><span data-i18n="taskName"></span><span data-i18n="hours"></span><span></span></div>
        <div id="taskList"></div>
        <button type="button" class="add" id="addTask">+ <span data-i18n="add"></span></button>

        <div class="sum"><span data-i18n="totalH"></span><strong id="sumH">0</strong></div>
      </section>
    </div>

    <aside class="col-sheet">
      <article class="sheet" id="sheet" aria-live="polite"></article>
      <div class="actions">
        <button type="button" class="btn primary wide" id="print" data-i18n="pdf"></button>
        <button type="button" class="btn" id="copy" data-i18n="copy"></button>
        <button type="button" class="btn" id="save" data-i18n="save"></button>
        <button type="button" class="btn ghost wide" id="newp" data-i18n="newp"></button>
      </div>
    </aside>
  </div>

  <section class="card saved">
    <div class="saved-head">
      <h2 data-i18n="saved"></h2>
      <span id="count"></span>
    </div>
    <div id="savedList" class="saved-list"></div>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>
</body>
</html>
